[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uran-interfaces"
version = "1.0.0"
description = "Platform-independent URAN business contracts"
readme = "README.md"
requires-python = ">=3.6"
license = "Apache-2.0"
dependencies = ["jsonschema>=4.18,<5"]

[project.optional-dependencies]
test = ["pytest>=7,<9", "build>=1,<2"]

[project.scripts]
uran-contract-validate = "uran_interfaces.cli:main"

[tool.setuptools]
package-dir = {"" = "bindings/python"}

[tool.setuptools.package-data]
uran_interfaces = ["schemas/**/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
